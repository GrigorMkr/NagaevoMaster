services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nagaevo
      POSTGRES_PASSWORD: nagaevo
      POSTGRES_DB: nagaevomaster
    ports:
      - '5432:5432'
    volumes:
      - nagaevo_pg:/var/lib/postgresql/data

volumes:
  nagaevo_pg:
