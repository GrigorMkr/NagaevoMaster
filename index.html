<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var host = location.hostname;
        if (host === 'www.nagaevomaster.ru') {
          location.replace('https://nagaevomaster.ru' + location.pathname + location.search + location.hash);
          return;
        }
        if (
          location.protocol === 'http:'
          && host !== 'localhost'
          && host !== '127.0.0.1'
        ) {
          location.replace('https://nagaevomaster.ru' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
