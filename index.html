<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script src="/boot-splash.js"></script>
    <link rel="stylesheet" href="/boot-splash.css" />
    <script src="/early-redirect.js"></script>
    <link rel="canonical" href="https://nagaevomaster.ru/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Нагаево Мастер" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#17624a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta
      name="description"
      content="Нагаево Мастер — агрегатор услуг и форум для поселка Нагаево. Поиск специалистов, техники и услуг в Нагаево и окрестностях."
    />
    <meta property="og:image" content="https://nagaevomaster.ru/og-image.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://nagaevomaster.ru/og-image.png" />
    <title>Нагаево Мастер — Все услуги поселка Нагаево</title>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Загрузка Нагаево Мастер">
      <div class="boot-splash-stage">
        <div class="boot-splash-aura" aria-hidden="true"></div>
        <div class="boot-splash-ring" aria-hidden="true"></div>
        <div class="boot-splash-ring-secondary" aria-hidden="true"></div>
        <div class="boot-splash-ring-tertiary" aria-hidden="true"></div>
        <div class="boot-splash-orbit" aria-hidden="true"></div>
        <img class="boot-splash-stamp" src="/favicon.svg" width="160" height="160" alt="" />
        <div class="boot-splash-shine" aria-hidden="true"></div>
      </div>
      <p class="boot-splash-label">Загрузка</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
