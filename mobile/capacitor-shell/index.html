<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#081f18" />
    <title>Нагаево Мастер</title>
    <script>
      document.documentElement.classList.add('native-app', 'boot-splash-active');
    </script>
    <link rel="stylesheet" href="boot-splash.css" />
    <style>
      body {
        margin: 0;
        background: #081f18;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Загрузка Нагаево Мастер">
      <div class="boot-splash-stage">
        <div class="boot-splash-aura" aria-hidden="true"></div>
        <div class="boot-splash-ring" aria-hidden="true"></div>
        <div class="boot-splash-ring-secondary" aria-hidden="true"></div>
        <div class="boot-splash-ring-tertiary" aria-hidden="true"></div>
        <div class="boot-splash-orbit" aria-hidden="true"></div>
        <img class="boot-splash-stamp" src="favicon.svg" width="160" height="160" alt="" />
        <div class="boot-splash-shine" aria-hidden="true"></div>
      </div>
      <p class="boot-splash-label">Подключение</p>
    </div>
  </body>
</html>
