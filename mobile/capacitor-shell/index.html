<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Нагаево Мастер</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #081f18;
        color: #e8f5ef;
        font-family: system-ui, -apple-system, sans-serif;
      }

      main {
        text-align: center;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }

      p {
        margin: 0;
        opacity: 0.72;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нагаево Мастер</h1>
      <p>Подключение к сайту…</p>
    </main>
  </body>
</html>
