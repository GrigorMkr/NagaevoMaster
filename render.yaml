services:
  - type: web
    name: nagaevomaster-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://nagaevomaster.ru,https://www.nagaevomaster.ru
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_UPLOAD_URL
        value: /uploads
      - key: SMTP_FROM
        value: "Нагаево Мастер <noreply@nagaevomaster.ru>"
      - key: DATABASE_URL
        fromDatabase:
          name: nagaevomaster-db
          property: connectionString

databases:
  - name: nagaevomaster-db
    plan: free
    databaseName: nagaevomaster
    user: nagaevomaster
