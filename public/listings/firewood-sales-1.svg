<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Дрова">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#g)"/>
  <circle cx="680" cy="80" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="120" cy="380" r="90" fill="rgba(0,0,0,0.12)"/>
  <text x="400" y="200" text-anchor="middle" font-size="96" fill="rgba(255,255,255,0.92)">🪵</text>
  <text x="400" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="rgba(255,255,255,0.95)">Дрова</text>
  <text x="400" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">с. Нагаево</text>
</svg>