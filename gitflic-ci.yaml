# GitFlic CI/CD → RuStore для «Нагаево Мастер»
# Документация: https://docs.gitflic.ru/cicd/rustore/

stages:
  - build
  - deploy

variables:
  CAPACITOR_BUNDLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

cache:
  paths:
    - node_modules/
    - backend/node_modules/
    - android/.gradle/

build:rustore:
  stage: build
  script:
    - node --version
    - java -version
    - node scripts/ci/prepare-android-ci.mjs
    - npm ci
    - npm ci --prefix backend
    - npm run build:rustore
  artifacts:
    paths:
      - artifacts/rustore/
      - mobile/app-version.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG

deploy:rustore:
  stage: deploy
  needs:
    - build:rustore
  script:
    - chmod +x rustore-deploy.sh
    - ./rustore-deploy.sh
  rules:
  # Ручной запуск после проверки сборки — безопаснее для модерации
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
