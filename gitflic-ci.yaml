# GitFlic CI/CD → RuStore для «Нагаево Мастер»
# Официальный шаблон GitFlic: https://gitflic.ru/project/gitflic/gitflic/blob?file=RuStore/gitflic-ci.yaml
# Документация: https://docs.gitflic.ru/cicd/rustore/
#
# Отличие от шаблона: self-hosted runner на Windows (PowerShell), полная сборка Capacitor/Android.
# Шаблон GitFlic рассчитан на image: debian:latest + bash rustore-deploy.sh.

stages:
  - build
  - rustore

variables:
  CAPACITOR_BUNDLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  RUSTORE_PACKAGE_NAME: "ru.nagaevomaster.app"
  # true — отправить на модерацию; false — только черновик + APK
  RUSTORE_SUBMIT_FOR_MODERATION: "true"

cache:
  paths:
    - node_modules/
    - backend/node_modules/
    - android/.gradle/

build:rustore:
  stage: build
  script:
    - $env:ANDROID_HOME = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { Join-Path $env:LOCALAPPDATA "Android\Sdk" }
    - $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
    - $javaHome = (node -e "import('./scripts/resolve-java-home.mjs').then(m=>console.log(m.findJavaHome()||''))" 2>$null | Select-Object -Last 1)
    - if ($javaHome) { $env:JAVA_HOME = $javaHome; $env:PATH = "$javaHome\bin;$env:PATH" }
    - node --version
    - java -version
    - node scripts/ci/prepare-android-ci.mjs
    - npm ci
    - npm ci --prefix backend
    - npm run build:rustore
  artifacts:
    paths:
      - artifacts/rustore/
      - mobile/app-version.json
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG

deploy:rustore:
  stage: rustore
  needs:
    - build:rustore
  script:
    # На Windows-runner bash может отсутствовать — вызываем Node напрямую.
    # Локально / Linux: bash rustore-deploy.sh (см. официальный шаблон GitFlic).
    - node scripts/rustore/deploy.mjs
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
